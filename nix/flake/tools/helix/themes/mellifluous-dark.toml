"comment" = { fg = "Comment.fg", modifiers = ["italic"] }
"constant" = { fg = "Constant.fg" }
"constant.character" = { fg = "String.fg" }
"string" = { fg = "String.fg" }
"string.regexp" = { fg = "Special.fg" }
"constant.character.escape" = { fg = "Special.fg" }
"variable" = { fg = "Identifier.fg" }
"variable.builtin" = { fg = "Constant.fg" }
"variable.parameter" = { fg = "Identifier.fg" }
"type" = { fg = "Type.fg" }
"constructor" = { fg = "Type.fg" }
"label" = { fg = "Keyword.fg" }
"module" = { fg = "@module.fg" }
"namespace" = { fg = "@module.fg" }
"keyword" = { fg = "Keyword.fg" }
"keyword.control" = { fg = "Conditional.fg" }
"keyword.control.repeat" = { fg = "Repeat.fg" }
"keyword.control.return" = { fg = "@keyword.return.fg" }
"keyword.directive" = { fg = "PreProc.fg" }
"operator" = { fg = "Operator.fg" }
"punctuation" = { fg = "Delimiter.fg" }
"punctuation.special" = { fg = "Special.fg" }
"function" = { fg = "Function.fg" }
"function.macro" = { fg = "PreProc.fg" }
"tag" = { fg = "Special.fg" }
"attribute" = { fg = "PreProc.fg" }
"special" = { fg = "Special.fg" }
"markup.heading" = { fg = "Function.fg", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link" = { fg = "@markup.link.url.fg", modifiers = ["underlined"] }
"markup.quote" = { fg = "Comment.fg", modifiers = ["italic"] }
"markup.list" = { fg = "Keyword.fg" }
"markup.raw" = { fg = "String.fg" }
"diff.plus" = { fg = "green", bg = "DiffAdd.bg" }
"diff.minus" = { fg = "red", bg = "DiffDelete.bg" }
"diff.delta" = { fg = "orange", bg = "DiffChange.bg" }
"ui.background" = {}
"ui.text" = { fg = "Normal.fg" }
"ui.text.focus" = { fg = "Normal.fg", bg = "PmenuSel.bg" }
"ui.text.inactive" = { fg = "fg3" }
"ui.gutter" = {}
"ui.linenr" = { fg = "fg3" }
"ui.linenr.selected" = { fg = "Keyword.fg", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "CursorLine.bg" }
"ui.cursor" = { modifiers = ["reversed"] }
"ui.cursor.primary" = { fg = "Cursor.fg", bg = "Cursor.bg" }
"ui.cursor.match" = { fg = "Keyword.fg", modifiers = ["underlined"] }
"ui.selection" = { bg = "Visual.bg" }
"ui.highlight" = { bg = "Search.bg" }
"ui.statusline" = { fg = "StatusLine.fg", bg = "StatusLine.bg" }
"ui.statusline.inactive" = { fg = "fg3", bg = "StatusLine.bg" }
"ui.statusline.normal" = { fg = "Normal.bg", bg = "functions", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "Normal.bg", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "Normal.bg", bg = "constants", modifiers = ["bold"] }
"ui.bufferline" = { fg = "StatusLine.fg", bg = "StatusLine.bg" }
"ui.bufferline.active" = { fg = "Normal.fg", bg = "Normal.bg", modifiers = ["bold"] }
"ui.popup" = { fg = "Normal.fg" }
"ui.menu" = { fg = "Normal.fg" }
"ui.menu.selected" = { fg = "Normal.fg", bg = "PmenuSel.bg" }
"ui.help" = { fg = "Normal.fg" }
"ui.window" = { fg = "fg4" }
"ui.virtual.whitespace" = { fg = "fg4" }
"ui.virtual.indent-guide" = { fg = "fg4" }
"ui.virtual.ruler" = { bg = "CursorLine.bg" }
"ui.virtual.inlay-hint" = { fg = "fg3" }
"ui.virtual.jump-label" = { fg = "Conditional.fg", modifiers = ["bold"] }
"error" = { fg = "DiagnosticError.fg" }
"warning" = { fg = "DiagnosticWarn.fg" }
"info" = { fg = "DiagnosticInfo.fg" }
"hint" = { fg = "DiagnosticHint.fg" }
"diagnostic.error" = { underline = { color = "DiagnosticError.fg", style = "curl" } }
"diagnostic.warning" = { underline = { color = "DiagnosticWarn.fg", style = "curl" } }
"diagnostic.info" = { underline = { color = "DiagnosticInfo.fg", style = "curl" } }
"diagnostic.hint" = { underline = { color = "DiagnosticHint.fg", style = "curl" } }

[palette]
"@keyword.return.fg" = "#d59192"
"@markup.link.url.fg" = "#817a95"
"@module.fg" = "#bfad9d"
