"Normal.bg" = "#1a1a1a"
"Normal.fg" = "#dadada"
"Operator.fg" = "#bfad9d"
"PmenuSel.bg" = "#3b3b3b"
"PreProc.fg" = "#a8a1be"
"Repeat.fg" = "#d59192"
"Search.bg" = "#3b372f"
"Special.fg" = "#cbaa88"
"StatusLine.bg" = "#2d2d2d"
"StatusLine.fg" = "#aeaeae"
"String.fg" = "#bfaf8e"
